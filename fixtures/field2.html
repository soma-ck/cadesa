<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadesa regression fixture: field report 2</title>
    <link rel="stylesheet" href="field2.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../fonts/InterVariable-latin.woff2") format("woff2"); }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <header class="ca-hero" data-fixture="hero">
      <img class="ca-hero__art" data-fixture="art" src="../examples/landing/assets/hero.svg" width="400" height="1920" alt="" />
      <div class="ca-hero__copy" data-fixture="copy">
        <div class="ca-hero__frame" data-fixture="frame">
          <h1 class="ca-hero__title" data-fixture="title">Écrire pour aller mieux</h1>
        </div>
      </div>
    </header>
    <section class="ca-stats" data-fixture="stats">
      <p class="ca-stats__stat" data-fixture="words">4 000 000+ mots</p>
      <p class="ca-stats__stat" data-fixture="years">35 ans</p>
      <p class="ca-stats__mail" data-fixture="mail">Write to reservations@kvitfjordpaddlingselskapet.example today</p>
      <p class="ca-stats__stat" data-fixture="french">100 % en français</p>
    </section>
    <section class="ca-faq" data-fixture="faq">
      <div class="ca-faq__answer" data-fixture="answer"><p>Des outils professionnels.</p><p>Développer une pratique quotidienne d’écriture.</p><p>Première ligne<br />Deuxième ligne</p></div>
      <p class="ca-faq__contact" data-fixture="contact">bookings@kvitfjordpaddlingselskapet.example</p>
      <div class="ca-faq__list" data-fixture="list">
        <img class="ca-faq__cover" data-fixture="cover-1" src="../examples/landing/assets/dawn.svg" width="400" height="1920" alt="" />
        <img class="ca-faq__cover" data-fixture="cover-2" src="../examples/landing/assets/seals.svg" width="1920" height="400" alt="" />
      </div>
    </section>
  </body>
</html>
