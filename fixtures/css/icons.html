<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadesa fixture: icons and other atomic inlines in text</title>
    <link rel="stylesheet" href="icons.css" />
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url("../../fonts/InterVariable-latin.woff2") format("woff2");
      }
    </style>
  </head>
  <body>
    <h1 class="title">Your garden, planned by a friendly <span>sp<svg class="title-icon" viewBox="0 0 470 262" aria-hidden="true"><rect width="470" height="262" rx="40" fill="#16a34a"></rect></svg>rout</span> that never sleeps</h1>
    <p class="status">Greenhouse<span class="status-dot"></span>open until six on weekdays and noon on Saturdays<span class="status-dot"></span>closed on Sundays</p>
    <p class="photo">See the <img class="photo-thumb" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt=""> plan for this month's beds.</p>
    <div class="toolbar">
      <div class="toolbar-button"><span class="toolbar-glyph"></span>Water</div>
      <div class="toolbar-button"><span class="toolbar-glyph"></span>Harvest</div>
    </div>
  </body>
</html>
