<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadesa fixture: a body that is a flex or grid container</title>
    <link rel="stylesheet" href="body.css" />
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url("../../fonts/InterVariable-latin.woff2") format("woff2");
      }
    </style>
  </head>
  <body>
    <header class="masthead">Harbor field notes</header>
    <nav class="rail">
      <a class="rail-link" href="#">Tides</a>
      <a class="rail-link" href="#">Boats</a>
      <a class="rail-link" href="#">Nets</a>
    </nav>
    <main class="content">
      <h1 class="content-title">The harbor town</h1>
      <p class="content-text">Notes kept over a long winter by everyone who stayed: the tides, the boats that left at dawn, and the nets mended by hand along the ridge.</p>
      <form class="signin">
        <h2 class="signin-title">Join the club</h2>
        <p class="signin-text">A short note on what we do and when we meet.</p>
      </form>
    </main>
    <footer class="footer">Field notes, May</footer>
  </body>
</html>
