# Only maxWidth (auto margins) centers a page-level box; a width token leaves it at the left
version: 1
tokens:
  space: { s: 0.5rem, m: 1rem, l: 2rem, odd: 0.2441rem }
  size: { w: 175px, w1: 93.5px, w2: 95.5px, a: 10rem, b: 20rem, c: 30rem, tiny: 10px, row: 3rem, short: 2rem, odd: 0.2441rem }
  color: { ink: "#1e1b4b", paper: "#ffffff" }
  font: { ui: "Inter, sans-serif" }
text:
  t: { font: ui, size: 1rem, weight: 400, lineHeight: 1.5, color: ink }
styles:
  c:
    width: a
    height: short
