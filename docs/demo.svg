<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="38" cy="18" r="5.5" fill="#febc2e"/><circle cx="56" cy="18" r="5.5" fill="#28c840"/>
<text x="488" y="22" text-anchor="middle" style="fill:#8a93a3;font-size:12px">cadesa · no browser</text>
<g xml:space="preserve">
<clipPath id="cl0"><rect x="36.9" y="44" height="20" width="577.2"/></clipPath>
<g id="l0"><text x="20" y="58"><tspan class="p">$</tspan> </text><text x="36.9" y="58" class="cmd" clip-path="url(#cl0)">cadesa whatif fixtures/settings.html --source settings.cadesa.yaml \</text></g>
<clipPath id="cl1"><rect x="36.9" y="64" height="20" width="484.5"/></clipPath>
<g id="l1"><text x="20" y="78">  </text><text x="36.9" y="78" class="cmd" clip-path="url(#cl1)">    --set styles.settings-panel.when.narrow.padding=panel</text></g>
<text id="l2" x="20" y="98">whatif styles.settings-panel.when.narrow.padding: compact → panel</text>
<text id="l3" x="20" y="118"><tspan class="d">(in memory, nothing written · computed in 63ms, no browser)</tspan></text>
<text id="l4" x="20" y="138"></text>
<text id="l5" x="20" y="158"><tspan class="w">390px</tspan><tspan class="d"> · narrow active</tspan></text>
<text id="l6" x="20" y="178">  #panel       padding 16px → 32px</text>
<text id="l7" x="20" y="198">                 <tspan class="d">← space.panel = 2rem ← when.narrow (390px ≤ 576px) ← styles.settings-panel.when.narrow.padding</tspan></text>
<text id="l8" x="20" y="218">               h 232.8 → 264.8</text>
<text id="l9" x="20" y="238">  #title       x 16 → 32  y 16 → 32  w 358 → 326</text>
<text id="l10" x="20" y="258">  #description x 16 → 32  y 68.8 → 84.8  w 358 → 326</text>
<text id="l11" x="20" y="278">  #actions     x 16 → 32  y 116.8 → 132.8  w 358 → 326</text>
<text id="l12" x="20" y="298">  #save        x 16 → 32  y 116.8 → 132.8  w 358 → 326</text>
<text id="l13" x="20" y="318">  #cancel      x 16 → 32  y 172.8 → 188.8  w 358 → 326</text>
<text id="l14" x="20" y="338"></text>
<text id="l15" x="20" y="358"><tspan class="w">1280px</tspan></text>
<text id="l16" x="20" y="378">  <tspan class="ok">✓ unchanged: no box moved, no property changed</tspan></text>
<text id="l17" x="20" y="398"></text>
<clipPath id="cl18"><rect x="36.9" y="404" height="20" width="686.8"/></clipPath>
<g id="l18"><text x="20" y="418"><tspan class="p">$</tspan> </text><text x="36.9" y="418" class="cmd" clip-path="url(#cl18)">cadesa check docs/demo/trips.html --source examples/landing/landing.cadesa.yaml \</text></g>
<clipPath id="cl19"><rect x="36.9" y="424" height="20" width="341.2"/></clipPath>
<g id="l19"><text x="20" y="438">  </text><text x="36.9" y="438" class="cmd" clip-path="url(#cl19)">    --widths 390,768,1024,1100,1280,1440</text></g>
<text id="l20" x="20" y="458"><tspan class="w">1100px</tspan></text>
<text id="l21" x="20" y="478">  <tspan class="warn">⚠ [layout]</tspan> "Overnattingskajakkturene" in #island-name can't wrap and overflows by 3.14px at 1100px</text>
<text id="l22" x="20" y="498">      <tspan class="d">edit:</tspan><tspan class="path"> styles.trip-card.slots.name.text</tspan></text>
