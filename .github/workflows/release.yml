name: release

# Publishes to npm when a version tag (v0.1.0, v0.2.0, ...) is pushed. Uses npm trusted publishing
# (OIDC): npm trusts this workflow in soma-ck/cadesa, so no token is stored anywhere, and each
# release gets a provenance statement linking it to the commit it was built from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: "Use an npm with trusted publishing (11.5.1 or later)"
        run: npm install -g npm@latest && npm --version
      - name: "Check the tag matches package.json"
        run: test "v$(node -p 'require(\"./package.json\").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: "Publish (typecheck and tests run first via prepublishOnly)"
        run: npm publish --access public --provenance
