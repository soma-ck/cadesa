# yaml-language-server: $schema=../../schema/cadesa.schema.json
# A page section made of nested components: pricing contains plan-card components.
version: 1
tokens:
  space: { section: 2rem, card: 1.25rem, item: 0.5rem, gutter: 1rem, control-inline: 1.25rem }
  size: { page: 64rem, card: 18rem, control: 2.75rem }
  color: { page: "#f4f5f7", surface: "#ffffff", ink: "#16181d", muted: "#5a5f6b", line: "#dde0e6", accent: "#2f5bea" }
  radius: { card: 0.75rem, control: 0.5rem }
  font: { ui: "Inter, sans-serif" }
text:
  heading: { font: ui, size: 2rem, weight: 700, lineHeight: 1.15, color: ink }
  lede: { font: ui, size: 1.0625rem, weight: 400, lineHeight: 1.5, color: muted }
  plan-name: { font: ui, size: 1.125rem, weight: 650, lineHeight: 1.3, color: ink }
  price: { font: ui, size: 2.25rem, weight: 700, lineHeight: 1.1, color: ink }
  feature: { font: ui, size: 0.9375rem, weight: 400, lineHeight: 1.45, color: muted }
  cta: { font: ui, size: 0.9375rem, weight: 600, lineHeight: 1.25, color: surface, decoration: none }
breakpoints:
  narrow: 40rem
styles:
  plan-card:
    intent: Each plan reads top to bottom; the price is the loudest element.
    layout: { pattern: stack, gap: card }
    padding: card
    background: surface
    border: line
    radius: card
    width: card
    slots:
      name: { text: plan-name }
      price: { text: price }
      features: { layout: { pattern: stack, gap: item } }
      feature: { text: feature }
      cta: { text: cta, textAlign: center, background: accent, radius: control, height: control, padding: { inline: control-inline } }
    when:
      narrow:
        width: fill
  pricing:
    intent: Plans sit side by side on wide screens and stack on phones.
    layout: { pattern: stack, gap: section }
    padding: section
    background: page
    maxWidth: page
    slots:
      head: { layout: { pattern: stack, gap: item } }
      title: { text: heading }
      lede: { text: lede }
      plans: { layout: { pattern: cluster, gap: gutter, align: stretch } }
    when:
      narrow:
        padding: gutter
        slots:
          plans: { layout: { pattern: stack, gap: gutter } }
